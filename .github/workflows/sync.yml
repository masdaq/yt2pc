name: YT Playlist Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Process single YouTube URL (optional)"
        required: false

# 同時実行の衝突回避
concurrency:
  group: yt2pc-playlist-sync
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      RAINDROP_RSS: ${{ vars.RAINDROP_RSS }}   # Secretsでも可
      SINGLE_URL:   ${{ inputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Write cookies (if any)
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            printf '%s' "${{ secrets.YT_COOKIES }}" > cookies.txt
          fi

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run sync
        run: python sync.py

      # --- Xserver へ鍵でアップロード（mp3 & feed.xml） ---
      - name: Add Xserver host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.XS_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure remote dir exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.XS_HOST }}
          username: ${{ secrets.XS_USER }}
          key:      ${{ secrets.XS_SSH_KEY }}
          port:     ${{ secrets.XS_SSH_PORT || 22 }}
          script: |
            mkdir -p /home/${{ secrets.XS_USER }}/<ドメイン>/public_html/podcasts/

      - name: Upload to Xserver (scp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.XS_HOST }}
          username: ${{ secrets.XS_USER }}
          key:      ${{ secrets.XS_SSH_KEY }}
          port:     ${{ secrets.XS_SSH_PORT || 22 }}
          source:   "podcasts/*"
          target:   "/home/${{ secrets.XS_USER }}/<ドメイン>/public_html/podcasts/"
          overwrite: true

name: YT Playlist Sync
on:
  schedule:
    - cron: "0 * * * *"       # 例：毎時（必要に応じて）
  workflow_dispatch:
    inputs:
      url:
        description: "Process single YouTube URL (optional)"
        required: false

concurrency:
  group: yt2pc-playlist-sync
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      RAINDROP_RSS: ${{ vars.RAINDROP_RSS }}  # ← Raindrop の RSS を Variables/Secrets に入れておく
      SINGLE_URL:   ${{ inputs.url }}         # 共有シートから単発で投げるとき用
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Setup FFmpeg (cached)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - run: pip install -r requirements.txt

      # ✅ Cookie を書くステップは完全に削除（もう不要）
      # - name: Write cookies ...
      #   run: ...

      - name: Run sync
        run: python sync.py

      # （この下に Xserver へのアップロードがあるならそのまま）
